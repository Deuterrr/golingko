openapi: 3.1.0
info:
  title: Golingko - One Platform, Multiple Transit Networks API
  version: 1.0.0
  description: |
    # Golingko - One Platform, Multiple Transit Networks

    Golingko is a backend engineering project that simulates an integrated public transportation ecosystem inspired by Jakarta's **JakLingko**. It aims to model how multiple transportation services, operators, routes, and transit networks can operate within a unified platform.

    ### Key Capabilities
    - **Multi-Modal Transit Network**: Real-time integration across **MRT Jakarta**, **LRT Jakarta**, **TransJakarta BRT**, and **Mikrotrans**.
    - **180-Minute Integrated Fare Policy**: Multi-operator journey tariffs automatically capped at **Rp 10,000** within a 180-minute transfer window.
    - **Accidental Tap Grace Period**: Accidental same-station tap-ins reversed with **Rp 0 fare** if tapped out within **3 minutes**.
    - **Strict Gate Protocol & Anti-Tailgating**: Enforces minimum gate balance (Rp 5,000), single active journey state machine, and automatic 4-hour abandoned journey sweeper penalties.
    - **Immutable Double-Entry Ledger**: Audit-proof balance tracking with pessimistic concurrency locking (`SELECT ... FOR UPDATE`).
    - **Distributed Idempotency**: In-memory 5-minute caching for financial mutations via the `Idempotency-Key` header with `X-Cache-Lookup: HIT` feedback.
  contact:
    name: Golingko Transit
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local Development Server

paths:
  /health:
    get:
      summary: System Health & Database Liveness
      description: Returns service operational status and PostgreSQL connection ping state.
      tags:
        - Health
      responses:
        '200':
          description: Health check details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: Fully operational system
                  value:
                    status: ok
                    database: connected
                    timestamp: "2026-10-30T09:50:00Z"
                degraded:
                  summary: Database unreachable / degraded
                  value:
                    status: degraded
                    database: unreachable
                    timestamp: "2026-10-30T09:50:00Z"

  /api/cards:
    post:
      summary: Provision Transit Card
      description: Creates a new virtual JakLingko smart card. If `card_number` is omitted or empty, an Luhn-compliant 16-digit card number is cryptographically generated.
      tags:
        - Cards
      requestBody:
        description: Initial card parameters
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardRequest'
            examples:
              withAutoGeneratedNumber:
                summary: Auto-generate 16-digit card number with Rp 50,000 balance
                value:
                  initial_balance: 50000
              withCustomCardNumber:
                summary: Specify custom card number
                value:
                  card_number: "1000889922334455"
                  initial_balance: 100000
      responses:
        '201':
          description: Card successfully provisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
              example:
                id: "7b47b4d3-1577-4be7-8da4-f584e03f569b"
                card_number: "1000889922334455"
                balance: 50000
                status: "active"
                created_at: "2026-10-30T09:50:00Z"
                updated_at: "2026-10-30T09:50:00Z"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/cards/{number}:
    get:
      summary: Get Card Details
      description: Retrieves metadata, account status, and current stored balance for the given 16-digit card number.
      tags:
        - Cards
      parameters:
        - name: number
          in: path
          required: true
          description: 16-digit transit card number
          schema:
            type: string
            example: "1000889922334455"
      responses:
        '200':
          description: Transit card record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
              example:
                id: "7b47b4d3-1577-4be7-8da4-f584e03f569b"
                card_number: "1000889922334455"
                balance: 50000
                status: "active"
                created_at: "2026-10-30T09:50:00Z"
                updated_at: "2026-10-30T09:50:00Z"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/cards/{number}/top-up:
    post:
      summary: Top Up Stored Balance
      description: |
        Atomically credits balance to a card within a pessimistic lock transaction and appends a `TOP_UP` entry to the immutable ledger.

        Supports idempotency via `Idempotency-Key` header. Repeat calls within 5 minutes return cached responses with header `X-Cache-Lookup: HIT`.
      tags:
        - Cards
      parameters:
        - name: number
          in: path
          required: true
          description: 16-digit transit card number
          schema:
            type: string
            example: "1000889922334455"
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopUpRequest'
            example:
              amount: 50000
      responses:
        '200':
          description: Balance successfully topped up
          headers:
            X-Cache-Lookup:
              schema:
                type: string
                example: "HIT"
              description: Indicates if response was served from idempotency cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUpResponse'
              example:
                card:
                  id: "7b47b4d3-1577-4be7-8da4-f584e03f569b"
                  card_number: "1000889922334455"
                  balance: 100000
                  status: "active"
                  created_at: "2026-10-30T09:50:00Z"
                  updated_at: "2026-10-30T09:52:00Z"
                transaction:
                  id: "9c3e4141-949e-4a6c-9407-73dcf0686ee4"
                  card_id: "7b47b4d3-1577-4be7-8da4-f584e03f569b"
                  transaction_type: "top_up"
                  amount: 50000
                  balance_after: 100000
                  idempotency_key: "topup-uuid-1234"
                  created_at: "2026-10-30T09:52:00Z"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/cards/{number}/transactions:
    get:
      summary: List Card Audit Ledger
      description: Returns chronological financial and trip ledger movements (Top-ups, Fare Deductions, Penalties, Refunds) for a card.
      tags:
        - Cards
      parameters:
        - name: number
          in: path
          required: true
          description: 16-digit transit card number
          schema:
            type: string
            example: "1000889922334455"
        - name: limit
          in: query
          required: false
          description: Maximum number of transactions to return (default 20)
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
            example: 10
      responses:
        '200':
          description: List of ledger transaction records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LedgerTransaction'
              example:
                - id: "9c3e4141-949e-4a6c-9407-73dcf0686ee4"
                  card_id: "7b47b4d3-1577-4be7-8da4-f584e03f569b"
                  journey_id: "a3b83921-2e68-45e3-984e-3f628ff3221b"
                  transaction_type: "fare_deduction"
                  amount: -9000
                  balance_after: 91000
                  idempotency_key: null
                  created_at: "2026-10-30T10:15:00Z"
                - id: "28e7eec8-5a2a-4f51-b8ef-5883a48e7ba6"
                  card_id: "7b47b4d3-1577-4be7-8da4-f584e03f569b"
                  transaction_type: "top_up"
                  amount: 50000
                  balance_after: 100000
                  idempotency_key: "topup-uuid-1234"
                  created_at: "2026-10-30T09:52:00Z"
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/stations:
    get:
      summary: List Transit Stations
      description: Retrieves the public transit station directory with optional filtering by operator mode, city, district, or route ID.
      tags:
        - Stations
      parameters:
        - name: mode
          in: query
          required: false
          description: Filter stations by transport operator mode
          schema:
            $ref: '#/components/schemas/TransitMode'
          example: "mrt"
        - name: city
          in: query
          required: false
          description: Filter stations by municipality (e.g. Jakarta Pusat, Kota Bekasi)
          schema:
            type: string
          example: "jakarta pusat"
        - name: district
          in: query
          required: false
          description: Filter stations by district/kecamatan (e.g. Menteng, Setiabudi)
          schema:
            type: string
          example: "menteng"
        - name: route_id
          in: query
          required: false
          description: Filter stations serving a specific transit route
          schema:
            type: string
          example: "MRT-M1"
      responses:
        '200':
          description: List of stations matching criteria
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Station'
              example:
                - id: "MRT-BHI"
                  name: "Bundaran HI"
                  slug: "bundaran-hi"
                  mode: "mrt"
                  zone_index: 1
                  city: "jakarta pusat"
                  district: "menteng"
                  subdistrict: "gondangdia"
                  latitude: -6.1925
                  longitude: 106.8236
                  is_active: true
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/stations/{id}:
    get:
      summary: Get Station Details
      description: Looks up detailed information for a specific transit station by its ID.
      tags:
        - Stations
      parameters:
        - name: id
          in: path
          required: true
          description: Unique terminal code of the transit station
          schema:
            type: string
          example: "MRT-DKA"
      responses:
        '200':
          description: Station details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Station'
        '404':
          description: Station not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/routes:
    get:
      summary: List Transit Routes
      description: Retrieves transit network routes and lines across all modes with optional filters.
      tags:
        - Routes
      parameters:
        - name: mode
          in: query
          required: false
          description: Filter routes by transit operator mode
          schema:
            $ref: '#/components/schemas/TransitMode'
          example: "mrt"
        - name: city
          in: query
          required: false
          description: Filter routes that have stops within a specific municipality
          schema:
            type: string
          example: "jakarta selatan"
      responses:
        '200':
          description: List of transit routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Route'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/routes/connectivity:
    get:
      summary: Check Route Connectivity
      description: Verifies direct transit corridor reachability, hop counts, and distance between two stations.
      tags:
        - Routes
      parameters:
        - name: origin
          in: query
          required: true
          description: Origin station terminal code
          schema:
            type: string
          example: "MRT-BLB"
        - name: destination
          in: query
          required: true
          description: Destination station terminal code
          schema:
            type: string
          example: "MRT-DKA"
      responses:
        '200':
          description: Route connectivity assessment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteConnectivity'
        '400':
          description: Missing required query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/routes/{id}:
    get:
      summary: Get Route with Ordered Stops
      description: Looks up detailed route specifications along with its ordered sequence of transit stops.
      tags:
        - Routes
      parameters:
        - name: id
          in: path
          required: true
          description: Unique route code (e.g. MRT-M1, TJ-1)
          schema:
            type: string
          example: "MRT-M1"
      responses:
        '200':
          description: Route details and stop sequence
          content:
            application/json:
              schema:
                type: object
                properties:
                  route:
                    $ref: '#/components/schemas/Route'
                  stops:
                    type: array
                    items:
                      $ref: '#/components/schemas/RouteStop'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Route inactive or suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/gate/tap-in:
    post:
      summary: Turnstile Gate Tap-In
      description: |
        Processes passenger tap-in entry at a station gate.

        Validations performed:
        - Card must exist and have `ACTIVE` status.
        - Card balance must be at least **Rp 5,000** (Minimum Entry Balance).
        - Station must exist and be active.
        - Anti-tailgating check: Card must NOT already have an active journey in progress (returns 409 Conflict). If an active journey exists older than 4 hours, it is expired with a Rp 10,000 penalty before starting a new journey.
      tags:
        - Gate
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TapInRequest'
            example:
              card_number: "1000889922334455"
              station_id: "MRT-BHI"
      responses:
        '200':
          description: Gate opened and journey started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TapInResponse'
              example:
                gate_opened: true
                journey:
                  id: "a3b83921-2e68-45e3-984e-3f628ff3221b"
                  card_id: "7b47b4d3-1577-4be7-8da4-f584e03f569b"
                  entry_station_id: "MRT-BHI"
                  entry_time: "2026-10-30T10:00:00Z"
                  fare_amount: 0
                  status: "in_progress"
                  created_at: "2026-10-30T10:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '402':
          description: Insufficient balance to open gate (Balance < Rp 5,000)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "insufficient balance to enter transit gate"
        '404':
          description: Card or station not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "transit station not found"
        '409':
          description: "Turnstile conflict: card already has an in-progress trip"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "card already has an in-progress journey"
        '422':
          description: Inactive card or station
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "transit card is not active"
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/gate/tap-out:
    post:
      summary: Turnstile Gate Tap-Out & Fare Clearing
      description: |
        Processes passenger tap-out at the destination station gate and calculates final integrated tariff:
        - Accidental tap grace period: Rp 0 charged if tapped out at entry station within 3 minutes.
        - Same-station platform fee: Rp 3,000 charged if exit exceeds 15 minutes.
        - Distance-based / Multi-modal tariff engine with JakLingko 180-minute transfer window cap (max Rp 10,000).
        - Balance deducted atomically and debit entry written to the ledger.
      tags:
        - Gate
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TapOutRequest'
            example:
              card_number: "1000889922334455"
              station_id: "MRT-BLB"
      responses:
        '200':
          description: Fare settled and exit turnstile unlocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TapOutResult'
              example:
                journey:
                  id: "a3b83921-2e68-45e3-984e-3f628ff3221b"
                  card_id: "7b47b4d3-1577-4be7-8da4-f584e03f569b"
                  entry_station_id: "MRT-BHI"
                  exit_station_id: "MRT-BLB"
                  entry_time: "2026-10-30T10:00:00Z"
                  exit_time: "2026-10-30T10:25:00Z"
                  fare_amount: 9000
                  status: "completed"
                  created_at: "2026-10-30T10:00:00Z"
                fare:
                  fare_amount: 9000
                  is_integrated: false
                  cap_applied: false
                  description: "mrt distance-based tariff"
                remaining_balance: 41000
                gate_opened: true
        '400':
          $ref: '#/components/responses/BadRequestError'
        '402':
          description: Card balance insufficient to pay exit fare (Passenger must top up at gate)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "insufficient balance for exit fare: top up required at gate"
        '404':
          description: Card or station not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "transit station not found"
        '409':
          description: No active journey in progress for card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "no active journey found for card"
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

components:
  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: Unique idempotency key (UUID or string) ensuring safe client retries without duplicate billing.
      schema:
        type: string
        example: "9f323a7e-128a-40a2-990a-f01878891abc"

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - database
        - timestamp
      properties:
        status:
          type: string
          enum: [ok, degraded]
          example: "ok"
        database:
          type: string
          enum: [connected, disconnected, unreachable]
          example: "connected"
        timestamp:
          type: string
          format: date-time
          example: "2026-10-30T09:50:00Z"

    CardStatus:
      type: string
      enum: [active, suspended, blocked]
      example: "active"

    TransitMode:
      type: string
      enum: [mrt, lrt, transjakarta, mikrotrans]
      example: "mrt"

    JourneyStatus:
      type: string
      enum: [in_progress, completed, penalty_settled, expired]
      example: "completed"

    TransactionType:
      type: string
      enum: [top_up, fare_deduction, penalty_fee, refund]
      example: "top_up"

    Card:
      type: object
      required:
        - id
        - card_number
        - balance
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: "7b47b4d3-1577-4be7-8da4-f584e03f569b"
        card_number:
          type: string
          pattern: '^[0-9]{16}$'
          example: "1000889922334455"
        balance:
          type: integer
          format: int64
          description: Balance in Indonesian Rupiah (IDR)
          example: 50000
        status:
          $ref: '#/components/schemas/CardStatus'
        created_at:
          type: string
          format: date-time
          example: "2026-10-30T09:50:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-10-30T09:50:00Z"

    CreateCardRequest:
      type: object
      properties:
        card_number:
          type: string
          description: Optional 16-digit card number. Auto-generated if omitted.
          example: "1000889922334455"
        initial_balance:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: Initial deposited balance in IDR
          example: 50000

    TopUpRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Top-up amount in Indonesian Rupiah (must be greater than 0)
          example: 50000

    TopUpResponse:
      type: object
      required:
        - card
        - transaction
      properties:
        card:
          $ref: '#/components/schemas/Card'
        transaction:
          $ref: '#/components/schemas/LedgerTransaction'

    Station:
      type: object
      required:
        - id
        - name
        - slug
        - mode
        - zone_index
        - city
        - district
        - subdistrict
        - is_active
      properties:
        id:
          type: string
          example: "MRT-BHI"
        name:
          type: string
          example: "Bundaran HI"
        slug:
          type: string
          description: Canonical URL-friendly slug identifier
          example: "bundaran-hi"
        mode:
          $ref: '#/components/schemas/TransitMode'
        zone_index:
          type: integer
          description: Jakarta tariff transit zone index (1 to 5)
          example: 1
        city:
          type: string
          example: "jakarta pusat"
        district:
          type: string
          example: "menteng"
        subdistrict:
          type: string
          example: "gondangdia"
        latitude:
          type: number
          format: float
          nullable: true
          example: -6.1925
        longitude:
          type: number
          format: float
          nullable: true
          example: 106.8236
        is_active:
          type: boolean
          example: true

    Route:
      type: object
      required:
        - id
        - code
        - name
        - slug
        - mode
        - is_active
      properties:
        id:
          type: string
          example: "MRT-M1"
        code:
          type: string
          example: "M1"
        name:
          type: string
          example: "MRT North-South Line (Lebak Bulus - Bundaran HI)"
        slug:
          type: string
          description: Canonical URL-friendly slug identifier
          example: "mrt-north-south-line-lebak-bulus-bundaran-hi"
        mode:
          $ref: '#/components/schemas/TransitMode'
        color_hex:
          type: string
          example: "#1e439b"
        is_active:
          type: boolean
          example: true

    RouteStop:
      type: object
      required:
        - route_id
        - station_id
        - stop_sequence
      properties:
        route_id:
          type: string
          example: "MRT-M1"
        station_id:
          type: string
          example: "MRT-BLB"
        station_name:
          type: string
          example: "Lebak Bulus Grab"
        station_slug:
          type: string
          description: Canonical station slug identifier
          example: "lebak-bulus-grab"
        mode:
          $ref: '#/components/schemas/TransitMode'
        city:
          type: string
          example: "jakarta selatan"
        district:
          type: string
          example: "cilandak"
        subdistrict:
          type: string
          example: "lebak bulus"
        stop_sequence:
          type: integer
          example: 1
        distance_from_origin_km:
          type: number
          format: float
          example: 0.0

    RouteConnectivity:
      type: object
      required:
        - is_direct
      properties:
        is_direct:
          type: boolean
          example: true
        connecting_route:
          $ref: '#/components/schemas/Route'
        hop_count:
          type: integer
          example: 2
        distance_delta_km:
          type: number
          format: float
          example: 11.2

    Journey:
      type: object
      required:
        - id
        - card_id
        - entry_station_id
        - entry_time
        - fare_amount
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
          example: "a3b83921-2e68-45e3-984e-3f628ff3221b"
        card_id:
          type: string
          format: uuid
          example: "7b47b4d3-1577-4be7-8da4-f584e03f569b"
        entry_station_id:
          type: string
          example: "MRT-BHI"
        exit_station_id:
          type: string
          nullable: true
          example: "MRT-BLB"
        route_id:
          type: string
          nullable: true
          example: "MRT-M1"
        entry_time:
          type: string
          format: date-time
          example: "2026-10-30T10:00:00Z"
        exit_time:
          type: string
          format: date-time
          nullable: true
          example: "2026-10-30T10:25:00Z"
        fare_amount:
          type: integer
          format: int64
          example: 9000
        status:
          $ref: '#/components/schemas/JourneyStatus'
        created_at:
          type: string
          format: date-time
          example: "2026-10-30T10:00:00Z"

    FareResult:
      type: object
      required:
        - fare_amount
        - is_integrated
        - cap_applied
        - description
      properties:
        fare_amount:
          type: integer
          format: int64
          description: Total tariff charged in IDR
          example: 9000
        is_integrated:
          type: boolean
          description: Whether JakLingko 180-min multi-operator integration applied
          example: false
        cap_applied:
          type: boolean
          description: Whether Rp 10,000 ceiling was triggered
          example: false
        description:
          type: string
          description: Tariff breakdown explanation
          example: "mrt distance-based tariff"

    TapInRequest:
      type: object
      required:
        - card_number
        - station_id
      properties:
        card_number:
          type: string
          example: "1000889922334455"
        station_id:
          type: string
          example: "MRT-BHI"
        route_id:
          type: string
          nullable: true
          description: Optional operational route line or vehicle run code
          example: "MRT-M1"

    TapInResponse:
      type: object
      required:
        - gate_opened
        - journey
      properties:
        gate_opened:
          type: boolean
          example: true
        journey:
          $ref: '#/components/schemas/Journey'

    TapOutRequest:
      type: object
      required:
        - card_number
        - station_id
      properties:
        card_number:
          type: string
          example: "1000889922334455"
        station_id:
          type: string
          example: "MRT-BLB"

    TapOutResult:
      type: object
      required:
        - journey
        - fare
        - remaining_balance
        - gate_opened
      properties:
        journey:
          $ref: '#/components/schemas/Journey'
        fare:
          $ref: '#/components/schemas/FareResult'
        remaining_balance:
          type: integer
          format: int64
          description: Card balance remaining after fare deduction
          example: 41000
        gate_opened:
          type: boolean
          example: true

    LedgerTransaction:
      type: object
      required:
        - id
        - card_id
        - transaction_type
        - amount
        - balance_after
        - created_at
      properties:
        id:
          type: string
          format: uuid
          example: "9c3e4141-949e-4a6c-9407-73dcf0686ee4"
        card_id:
          type: string
          format: uuid
          example: "7b47b4d3-1577-4be7-8da4-f584e03f569b"
        journey_id:
          type: string
          format: uuid
          nullable: true
          example: "a3b83921-2e68-45e3-984e-3f628ff3221b"
        transaction_type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          type: integer
          format: int64
          description: Positive for balance credit, negative for fare deduction
          example: 50000
        balance_after:
          type: integer
          format: int64
          description: Resulting card balance following atomic mutation
          example: 100000
        idempotency_key:
          type: string
          nullable: true
          example: "topup-uuid-1234"
        created_at:
          type: string
          format: date-time
          example: "2026-10-30T09:52:00Z"

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "transit card not found"

  responses:
    BadRequestError:
      description: Invalid request body or missing mandatory fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "invalid request payload"

    NotFoundError:
      description: Requested card, station, or journey not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "transit card not found"

    UnprocessableEntityError:
      description: Business logic constraint violated (e.g. card inactive, non-positive amount)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "amount must be greater than zero"

    InternalServerError:
      description: Unhandled internal server error or database query failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "internal server error"

    ServiceUnavailableError:
      description: Required domain service dependency is nil or unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "service unavailable"
