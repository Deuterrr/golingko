version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: golingko_postgres
    restart: always
    environment:
      POSTGRES_USER: golingko_user
      POSTGRES_PASSWORD: golingko_password
      POSTGRES_DB: golingko_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: golingko_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
